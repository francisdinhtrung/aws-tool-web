name: Bug report
description: Report a bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste access keys, secret keys, session tokens or other sensitive data into an issue.**"
  - type: textarea
    id: what
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See error ..."
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Connections, DynamoDB, S3, CloudWatch Logs, SQS, Lambda, Data modeler, Other]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version / image tag
      placeholder: "francisdinhtrung/aws-tool-web:1.1.0"
  - type: input
    id: target
    attributes:
      label: AWS environment
      placeholder: "Real AWS / LocalStack / DynamoDB Local / MinIO ..."
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Container logs (`docker logs aws-tool-web`) or the browser console.
      render: text
